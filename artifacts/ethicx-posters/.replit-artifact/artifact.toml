kind = "web"
previewPath = "/"
title = "EthicX Poster Generator"
version = "1.0.0"
id = "artifacts/ethicx-posters"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20271

[services.development]
run = "pnpm --filter @workspace/ethicx-posters run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ethicx-posters", "run", "build" ]
serve = "static"
publicDir = "artifacts/ethicx-posters/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20271"
BASE_PATH = "/"
